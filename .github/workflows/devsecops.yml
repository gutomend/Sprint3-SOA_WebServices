name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and unit tests
        run: mvn -B clean test

      - name: SAST with Semgrep
        run: |
          python3 -m pip install --upgrade semgrep
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --exclude target \
            --error \
            --metrics=off

      - name: SCA with Snyk
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --all-projects

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --config .gitleaks.toml --no-banner --redact

      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t autospec-api:ci .

      - name: Container security with Trivy
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: autospec-api:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Deploy placeholder
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "Deploy placeholder: conecte este passo ao ambiente real de destino quando ele existir."
